[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ege-informatics-workspace-backend"
version = "0.1.0"
description = "Private EGE Informatics Workspace backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "openpyxl>=3.1.5,<4",
  "xlrd>=2.0.2,<3",
  "odfpy>=1.4.1,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
# Route contracts contain long, explicit dependency signatures; 120 keeps them
# readable while preserving the default meaningful lint rules.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# FastAPI's dependency injection idiom intentionally calls Depends in defaults.
[tool.ruff.lint.per-file-ignores]
"app/api.py" = ["B008"]
"app/api_common.py" = ["B008"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "tests*"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
disallow_any_generics = false
no_implicit_optional = true
ignore_missing_imports = true
