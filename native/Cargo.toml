[package]
name = "kontur-local"
version = "0.1.0"
description = "Контур Локальный — offline Windows application"
authors = ["Kontur"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "kontur_offline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kontur-local"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "=0.39.1"
